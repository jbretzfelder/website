<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinical Training</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232d6a4f'/%3E%3Cg transform='translate(2,6)' fill='none' stroke='%23d4eadd' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 3C10.5 1.3 5.5 1 2 2v15c3.5-1 8.5-.7 12 1'/%3E%3Cpath d='M14 3c3.5-1.7 8.5-2 12-1v15c-3.5-1-8.5-.7-12 1'/%3E%3Cline x1='14' y1='3' x2='14' y2='19'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="training-root"></div>
<noscript>This training requires JavaScript.</noscript>
<script>
(async function(){
  const files = [
      "views/home.html",
      "views/bigpicture.html",
      "views/loc.html",
      "views/asam.html",
      "views/itp.html",
      "views/note.html",
      "views/conclusion.html",
      "views/cooccurring.html",
      "views/mi.html",
      "views/group.html",
      "views/ethics.html",
      "views/family.html",
      "views/culture.html",
      "views/updated-assessments.html"
  ];
  const root = document.getElementById('training-root');
  try{
    const parts = await Promise.all(files.map(async file => {
      const response = await fetch(file, {cache:'no-store'});
      if(!response.ok) throw new Error(file + ' (' + response.status + ')');
      return await response.text();
    }));
    root.innerHTML = parts.join('\n');
    const script = document.createElement('script');
    script.src = 'training.js';
    script.defer = false;
    script.onerror = () => {
      root.innerHTML = '<div style="padding:32px;font-family:sans-serif">Clinical Training could not load training.js.</div>';
    };
    document.body.appendChild(script);
  }catch(err){
    root.innerHTML = '<div style="padding:32px;font-family:sans-serif"><h1>Clinical Training could not load</h1><p>One of the training files is missing or unavailable.</p><pre></pre></div>';
    root.querySelector('pre').textContent = String(err);
  }
})();
</script>
</body>
</html>
