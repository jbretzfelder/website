<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Woodhaven Transition Guide</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --border: #d0d5dd;
      --primary: #1f4f78;
      --primary-dark: #163a59;
      --soft: #eef4f8;
      --warning: #fff8e6;
      --warning-border: #e6c96b;
      --success: #eef8f1;
      --success-border: #8ec79b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      color: var(--primary-dark);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 3px 12px rgba(16, 24, 40, 0.06);
    }

    .progress {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .progress span {
      height: 7px;
      flex: 1;
      background: #e4e7ec;
      border-radius: 999px;
    }

    .progress span.active { background: var(--primary); }

    .step-label {
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 0.92rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 1.45rem;
    }

    .help {
      color: var(--muted);
      margin-bottom: 18px;
    }

    .choices {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      width: 100%;
      border: 1px solid var(--primary);
      background: #fff;
      color: var(--primary-dark);
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover, button:focus {
      background: var(--soft);
      outline: none;
    }

    .secondary {
      border-color: var(--border);
      color: var(--text);
      font-weight: 600;
    }

    .result {
      border: 1px solid var(--success-border);
      background: var(--success);
      border-radius: 12px;
      padding: 18px;
      margin-top: 18px;
    }

    .result h3 { margin-top: 0; }

    .warning {
      border: 1px solid var(--warning-border);
      background: var(--warning);
      border-radius: 12px;
      padding: 16px;
      margin-top: 18px;
    }

    ul { padding-left: 22px; }
    li + li { margin-top: 6px; }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .actions button {
      width: auto;
      min-width: 140px;
      text-align: center;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
    }

    .sober-box {
      margin-top: 18px;
      border: 1px solid var(--border);
      background: #fafafa;
      border-radius: 12px;
      padding: 16px;
    }

    .sober-box strong { color: var(--primary-dark); }

    @media (max-width: 600px) {
      .card { padding: 18px; }
      h1 { font-size: 1.7rem; }
      h2 { font-size: 1.25rem; }
      .actions { flex-direction: column; }
      .actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Woodhaven Transition Guide</h1>
      <p class="subtitle">A simple guide for level-of-care transitions, referrals, completion, and client choice.</p>
    </header>

    <main class="card" id="app"></main>

    <p class="footer-note">Use this guide as a staff reference. Individual clinical circumstances should be reviewed with a supervisor or treatment team when the standard pathway does not fit.</p>
  </div>

  <script>
    const app = document.getElementById('app');

    const state = {
      canProvide: null,
      acceptsWoodhaven: null,
      completedCurrentLOC: null,
      continuedTreatmentRecommended: null
    };

    const totalSteps = 5;

    function progress(step) {
      return `<div class="progress">${Array.from({ length: totalSteps }, (_, i) => `<span class="${i < step ? 'active' : ''}"></span>`).join('')}</div>`;
    }

    function renderStart() {
      app.innerHTML = `
        ${progress(0)}
        <div class="step-label">Start</div>
        <h2>What does the client clinically need next?</h2>
        <p class="help">Determine the appropriate next level of care based on the client's current clinical needs. External requirements, client preference, or length of stay do not replace the clinical recommendation.</p>
        <div class="choices">
          <button onclick="renderCanProvide()">A next level of care has been clinically identified</button>
        </div>
        <div class="sober-box">
          <strong>Sober living is separate from clinical treatment.</strong><br>
          When sober living is indicated, Woodhaven Sober Living should be the first option presented and referred to. Clients may choose another residence. Housing choice alone does not determine treatment completion or ASA status.
        </div>
      `;
    }

    function renderCanProvide() {
      app.innerHTML = `
        ${progress(1)}
        <div class="step-label">Step 1</div>
        <h2>Can Woodhaven appropriately provide the recommended next level of care?</h2>
        <p class="help">Consider clinical fit, capacity, insurance, and whether Woodhaven can meet the client's needs.</p>
        <div class="choices">
          <button onclick="setCanProvide(true)">Yes - Woodhaven can provide the recommended care</button>
          <button onclick="setCanProvide(false)">No - Woodhaven cannot appropriately provide the recommended care</button>
        </div>
        <div class="actions">
          <button class="secondary" onclick="renderStart()">Back</button>
        </div>
      `;
    }

    function setCanProvide(value) {
      state.canProvide = value;
      if (!value) {
        renderOutsideReferral();
      } else {
        renderAcceptsWoodhaven();
      }
    }

    function renderOutsideReferral() {
      app.innerHTML = `
        ${progress(2)}
        <div class="step-label">Outcome</div>
        <h2>TRANSITION TO AN OUTSIDE PROVIDER</h2>
        <p class="help">Woodhaven cannot appropriately provide the recommended care. Move forward with an outside transition.</p>
        <div class="result">
          <h3>Do these steps in order</h3>
          <ol>
            <li><strong>Tell the supervisor.</strong> Give the planned departure date.</li>
            <li><strong>Document the recommended next level of care</strong> and why Woodhaven cannot provide it.</li>
            <li><strong>Identify an appropriate outside provider</strong> and assist with continuity of care.</li>
            <li><strong>Make sure UM is aware</strong> of the planned transition.</li>
            <li><strong>Coordinate with Admissions to ensure the client can receive their property at the time of their transition.</strong> before departure.</li>
            <li><strong>Complete the discharge process.</strong> This outside transition is not a client failure when Woodhaven cannot provide the recommended care.</li>
            <li><strong>Provide a certificate if needed.</strong> It may show the level(s) of care completed and Woodhaven's recommended next level of care.</li>
          </ol>
        </div>
        <div class="sober-box">
          <strong>Sober Living Reminder:</strong><br>
          Sober living is separate from clinical treatment. Woodhaven Sober Living is the first option presented and referred to, but a client may choose another residence. Housing choice alone does not determine treatment completion or ASA status.
        </div>
        <div class="actions">
          <button class="secondary" onclick="renderCanProvide()">Back</button>
          <button class="secondary" onclick="resetGuide()">Start Over</button>
        </div>
      `;
    }

    function renderAcceptsWoodhaven() {
      app.innerHTML = `
        ${progress(2)}
        <div class="step-label">Step 2</div>
        <h2>Does the client accept the recommended Woodhaven clinical plan?</h2>
        <p class="help">Woodhaven is the default continuation plan when we can appropriately provide the recommended care. The client still has the right to choose another provider.</p>
        <div class="choices">
          <button onclick="setAccepts(true)">Yes - Client accepts the Woodhaven plan</button>
          <button onclick="setAccepts(false)">No - Client plans to leave Woodhaven or use another provider</button>
        </div>
        <div class="actions">
          <button class="secondary" onclick="renderCanProvide()">Back</button>
        </div>
      `;
    }

    function setAccepts(value) {
      state.acceptsWoodhaven = value;
      renderCompletedLOC();
    }

    function renderCompletedLOC() {
      app.innerHTML = `
        ${progress(3)}
        <div class="step-label">Step 3</div>
        <h2>Did the client successfully complete the current level of care?</h2>
        <p class="help">Completing one level of care does not automatically mean the client has completed the full recommended course of treatment.</p>
        <div class="choices">
          <button onclick="setCompletedLOC(true)">Yes - Current level of care was completed</button>
          <button onclick="setCompletedLOC(false)">No - Current level of care was not completed</button>
        </div>
        <div class="actions">
          <button class="secondary" onclick="renderAcceptsWoodhaven()">Back</button>
        </div>
      `;
    }

    function setCompletedLOC(value) {
      state.completedCurrentLOC = value;
      renderContinuedTreatment();
    }

    function renderContinuedTreatment() {
      app.innerHTML = `
        ${progress(4)}
        <div class="step-label">Step 4</div>
        <h2>Is additional clinical treatment recommended?</h2>
        <p class="help">Answer based on the client's current clinical needs.</p>
        <div class="choices">
          <button onclick="setContinued(true)">Yes - Continued treatment is clinically recommended</button>
          <button onclick="setContinued(false)">No - Treatment is clinically complete</button>
        </div>
        <div class="actions">
          <button class="secondary" onclick="renderCompletedLOC()">Back</button>
        </div>
      `;
    }

    function setContinued(value) {
      state.continuedTreatmentRecommended = value;
      renderResult();
    }

    function certificateLine() {
      if (!state.completedCurrentLOC) return '';
      if (state.continuedTreatmentRecommended) {
        return `<li><strong>Certificate if needed:</strong> Provide documentation showing the level(s) of care successfully completed and the next level of care Woodhaven recommends. The certificate does <strong>not</strong> state that the client is done with treatment.</li>`;
      }
      return `<li><strong>Certificate if needed:</strong> Provide the appropriate completion documentation.</li>`;
    }

    function renderResult() {
      let status = '';
      let intro = '';
      let steps = '';

      if (state.canProvide && state.acceptsWoodhaven && state.continuedTreatmentRecommended) {
        status = 'CONTINUE AT WOODHAVEN';
        intro = 'The client needs more treatment, Woodhaven can provide it, and the client accepts the plan.';
        steps = `
          <li><strong>Continue the client</strong> into the recommended Woodhaven level of care.</li>
          <li><strong>Document the next level of care</strong> and the clinical reason for the recommendation.</li>
          ${state.completedCurrentLOC
            ? '<li><strong>Document completion of the current level of care.</strong> Remember: completion of this level does not mean treatment is complete.</li>'
            : '<li><strong>Do not document the current level of care as successfully completed.</strong></li>'}
          ${certificateLine()}
        `;
      } else if (state.canProvide && !state.acceptsWoodhaven && state.continuedTreatmentRecommended) {
        status = 'TRANSITION OUT OF WOODHAVEN - UNSUCCESSFUL / ASA';
        intro = 'Woodhaven can provide the recommended continued treatment, but the client has chosen to leave Woodhaven programming before completing the full recommended course of treatment.';
        steps = `
          <li><strong>Tell the supervisor immediately.</strong> Give the date the client plans to leave.</li>
          <li><strong>Document Woodhaven's clinical recommendation</strong> and document that the client chose another provider or another course of treatment.</li>
          <li><strong>Assist with the transition</strong> and continuity of care to the client's chosen provider when applicable.</li>
          <li><strong>Make sure UM is aware</strong> of the planned departure date.</li>
          <li><strong>Coordinate with Admissions to ensure the client can receive their property at the time of their transition.</strong> before departure.</li>
          <li><strong>Send the discharge email as Unsuccessful - Against Staff Advice (ASA).</strong></li>
          ${state.completedCurrentLOC
            ? '<li><strong>Document the current level of care as completed.</strong> This does not mean the full course of treatment was completed.</li>'
            : '<li><strong>Do not document the current level of care as successfully completed.</strong></li>'}
          ${certificateLine()}
        `;
      } else if (!state.continuedTreatmentRecommended && state.completedCurrentLOC) {
        status = 'SUCCESSFUL COMPLETION';
        intro = 'The client completed the current level of care and no additional clinical treatment is recommended.';
        steps = `
          <li><strong>Document successful completion</strong> of the current level of care and the overall recommended course of treatment.</li>
          <li><strong>Complete the normal successful discharge process.</strong></li>
          <li><strong>Provide completion documentation or certificate</strong> when needed.</li>
        `;
      } else if (!state.continuedTreatmentRecommended && !state.completedCurrentLOC) {
        status = 'SUPERVISOR REVIEW REQUIRED';
        intro = 'The client did not complete the current level of care, but no additional treatment is being recommended. This combination needs review before the discharge is finalized.';
        steps = `
          <li><strong>Stop and review the case with the supervisor.</strong></li>
          <li><strong>Do not independently label the discharge successful.</strong></li>
          <li><strong>Confirm the clinical recommendation and discharge status</strong> before sending the discharge email or issuing completion documentation.</li>
        `;
      }

      app.innerHTML = `
        ${progress(5)}
        <div class="step-label">Your Outcome</div>
        <h2>${status}</h2>
        <p class="help">${intro}</p>
        <div class="result">
          <h3>Do these steps in order</h3>
          <ol>${steps}</ol>
        </div>

        ${state.completedCurrentLOC && state.continuedTreatmentRecommended ? `
          <div class="warning">
            <strong>Certificate wording:</strong><br>
            Completed: <em>[ASAM level(s) completed]</em><br>
            Recommended next: <em>[recommended ASAM level]</em><br><br>
            This documents what the client completed without stating that the client is done with treatment.
          </div>
        ` : ''}

        <div class="sober-box">
          <strong>Sober Living Reminder:</strong><br>
          Sober living is separate from clinical treatment. Woodhaven Sober Living is the first option presented and referred to. A client may choose another residence. <strong>Housing choice alone does not determine successful completion or ASA status.</strong>
        </div>

        <div class="actions">
          <button class="secondary" onclick="renderContinuedTreatment()">Back</button>
          <button class="secondary" onclick="resetGuide()">Start Over</button>
        </div>
      `;
    }

    function resetGuide() {
      state.canProvide = null;
      state.acceptsWoodhaven = null;
      state.completedCurrentLOC = null;
      state.continuedTreatmentRecommended = null;
      renderStart();
    }

    renderStart();
  </script>
</body>
</html>
