<style>
  :root{
    --green-700:#2d6a4f; --green-900:#1b4332; --green-100:#e8f3ec;
    --ink:#2a2a24; --ink-soft:#6b6a5f; --border:#e5e3da; --white:#fff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, #f7f9f0 0%, #fdf8e1 100%);
    font-family:'IBM Plex Sans', system-ui, sans-serif; color:var(--ink); padding:24px;
  }
  .card{
    background:var(--white); border:1px solid var(--border); border-radius:16px;
    max-width:440px; width:100%; padding:36px 32px; text-align:center;
    box-shadow:0 4px 24px rgba(0,0,0,.06);
  }
  .icon{
    width:52px; height:52px; border-radius:12px; background:var(--green-100); color:var(--green-700);
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px;
  }
  h1{font-size:19px; font-weight:700; color:var(--green-900); margin:0 0 10px;}
  p{font-size:14.5px; color:var(--ink-soft); line-height:1.55; margin:0 0 22px;}
  .url-box{
    font-family:'IBM Plex Mono', monospace; font-size:14px; color:var(--green-700);
    background:var(--green-100); border-radius:10px; padding:12px 16px; margin-bottom:22px;
    word-break:break-all;
  }
  a.btn{
    display:inline-block; background:var(--green-700); color:#fff; text-decoration:none;
    font-weight:600; font-size:14.5px; padding:12px 24px; border-radius:10px;
    transition:background .15s ease;
  }
  a.btn:hover{background:var(--green-900);}
  .note{font-size:12px; color:var(--ink-soft); margin-top:18px;}
</style>
